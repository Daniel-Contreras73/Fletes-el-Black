services:
  db:
    image: mysql:8.0
    container_name: fletes-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fletes_black
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: fletes-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: mysql://root:root@db:3306/fletes_black
      JWT_SECRET: ${JWT_SECRET:-fletes_secret_key_2024}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-fletes_refresh_secret_2024}
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

  frontend:
    build:
      context: ./fletes-black
      args:
        VITE_API_URL: /api
    container_name: fletes-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  uploads_data:
